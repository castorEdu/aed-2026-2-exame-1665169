demo:
  topico: loja.pedido.confirmado.v1
  topico-pagamento-recusado: loja.pagamento.recusado.v1

spring:
  application:
    name: servico-pedidos

  kafka:
    bootstrap-servers: localhost:19092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all                       # nao considera gravado ate as replicas confirmarem
      properties:
        enable.idempotence: true      # evita duplicata gerada pelo retry do PRODUTOR
        # Nao envia o nome da classe Java no cabecalho. Se enviasse, estaria
        # empurrando um detalhe INTERNO deste servico para dentro do contrato —
        # e o consumidor, que tem a classe dele, nao saberia o que fazer com isso.
        spring.json.add.type.headers: false

server:
  port: 8080

logging:
  level:
    root: WARN
    br.pucminas.aed: INFO
    org.springframework.boot: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %-28logger{0} : %msg%n"
